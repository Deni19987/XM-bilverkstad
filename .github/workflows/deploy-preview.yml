name: Deploy preview

on:
  pull_request:

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write
  pull-requests: write

jobs:
  preview:
    name: Netlify deploy preview
    runs-on: ubuntu-latest
    steps:
      - name: Check for Netlify credentials
        id: creds
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sätt hemligheterna NETLIFY_AUTH_TOKEN och NETLIFY_SITE_ID för att få en förhandsvisning på varje PR."
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'

      - uses: oven-sh/setup-bun@v2
        if: steps.creds.outputs.ready == 'true'
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        run: bun install --frozen-lockfile

      - name: Deploy to Netlify
        id: deploy
        if: steps.creds.outputs.ready == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -o pipefail
          bunx netlify-cli@latest deploy \
            --build \
            --context deploy-preview \
            --alias "pr-${{ github.event.number }}" \
            --message "PR #${{ github.event.number }}: ${{ github.event.pull_request.title }}" \
            --json > deploy.json
          echo "url=$(jq -r '.deploy_url' deploy.json)" >> "$GITHUB_OUTPUT"
          echo "logs=$(jq -r '.logs' deploy.json)" >> "$GITHUB_OUTPUT"

      # Lägger förhandsvisningen som en egen rad bland checkarna, där
      # "Details" går rakt till den byggda sajten i stället för till loggen.
      - name: Publish preview URL as a check
        if: steps.creds.outputs.ready == 'true'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'success',
              context: 'netlify/deploy-preview',
              target_url: process.env.PREVIEW_URL,
              description: 'Öppna förhandsvisningen',
            })

      - name: Comment the preview URL on the PR
        if: steps.creds.outputs.ready == 'true'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          LOGS_URL: ${{ steps.deploy.outputs.logs }}
        with:
          script: |
            const marker = '<!-- netlify-deploy-preview -->'
            const body = [
              marker,
              '### Förhandsvisning',
              '',
              `**[Öppna sajten](${process.env.PREVIEW_URL})** · [byggloggen](${process.env.LOGS_URL})`,
              '',
              `Byggd från commit \`${context.payload.pull_request.head.sha.slice(0, 7)}\`.`,
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n')

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find((c) => c.body?.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
