name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - 'dependabot/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Bygget måste gå först: TanStack Router-pluginen skriver
      # src/routeTree.gen.ts, som är gitignorerad. I en färsk checkout finns
      # den inte, och då hittar tsc varken routeTree.gen eller de typer som
      # varje route hämtar därifrån.
      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck
