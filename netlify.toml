[build]
  command = "bun run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"

# Vite fingerprints everything under /assets, so those URLs are safe to cache
# forever — a change produces a new filename.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images keep stable filenames, so they must be revalidated. Caching them as
# immutable would pin browsers and CDN edges to a stale copy for a year, and
# replacing an image would never reach anyone who had already loaded the page.
# ETags keep revalidation cheap: unchanged files come back as a 304.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
